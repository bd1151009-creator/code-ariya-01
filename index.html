<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>曹亦天 | 個人主頁</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vibrantYellow: '#FFD026',
                        vibrantCoral: '#FF5E7E',
                        vibrantBlue: '#3B82F6',
                        vibrantCyan: '#06B6D4',
                        darkText: '#1E1B4B',
                        lightBg: '#FAFAFF',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Noto Sans TC', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
            background-color: #FAFAFF;
            color: #1E1B4B;
        }

        /* Vibrant Gradients & Blobs */
        .bg-vibrant-gradient {
            background: linear-gradient(135deg, #FFF6D6 0%, #FFE5EC 50%, #E0F2FE 100%);
        }

        .gradient-text {
            background: linear-gradient(135deg, #FF3366 0%, #FF6B00 50%, #3B82F6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .avatar-gradient-ring {
            background: linear-gradient(45deg, #FF5E7E, #FFD026, #06B6D4);
            background-size: 200% 200%;
            animation: gradientMove 4s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body class="antialiased min-h-screen bg-vibrant-gradient relative overflow-x-hidden selection:bg-vibrantYellow selection:text-darkText flex flex-col justify-between">

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 transform translate-y-24 opacity-0 transition-all duration-300 z-50 flex items-center gap-3 bg-darkText text-white px-5 py-3 rounded-2xl shadow-2xl">
        <div class="w-7 h-7 rounded-full bg-emerald-400 flex items-center justify-center text-darkText font-bold text-xs">✓</div>
        <span id="toast-msg" class="text-sm font-semibold">已成功複製！</span>
    </div>

    <!-- Main Container -->
    <main class="max-w-2xl mx-auto px-6 py-12 w-full flex-grow flex flex-col justify-center">

        <!-- PROFILE HERO CARD -->
        <div class="glass-card rounded-3xl p-8 sm:p-10 shadow-xl shadow-indigo-100/50 mb-6 text-center relative overflow-hidden">
            <!-- Decorative Color Glow -->
            <div class="absolute -top-12 -right-12 w-36 h-36 bg-vibrantYellow/40 rounded-full blur-2xl pointer-events-none"></div>
            <div class="absolute -bottom-12 -left-12 w-36 h-36 bg-vibrantCoral/30 rounded-full blur-2xl pointer-events-none"></div>

            <!-- PHOTO PLACEHOLDER (個人照片位置) -->
            <div class="relative w-32 h-32 sm:w-36 sm:h-36 mx-auto mb-6 group">
                <div class="absolute inset-0 rounded-full avatar-gradient-ring p-1 shadow-lg shadow-pink-500/20">
                    <div class="w-full h-full rounded-full bg-white overflow-hidden relative">
                        <!-- 預設占位圖片 (可直接將 src 替換為您的照片 URL) -->
                        <img id="avatar-img" src="https://placehold.co/300x300/FFE5EC/FF3366?text=%E6%9B%B9%E4%BA%A6%E5%A4%A9" alt="曹亦天的大頭照" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                    </div>
                </div>
                <!-- 提示標籤 (滑鼠懸停時顯示) -->
                <div class="absolute inset-0 bg-darkText/60 rounded-full opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center justify-center text-white text-xs font-semibold p-2">
                    <i class="fa-solid fa-camera text-base mb-1"></i>
                    <span>替換照片</span>
                </div>
            </div>

            <!-- Name & Department -->
            <h1 class="text-3xl sm:text-4xl font-black text-darkText tracking-tight mb-2">
                曹亦天 <span class="text-xs font-bold px-3 py-1 bg-vibrantYellow/60 text-darkText rounded-full uppercase tracking-wider align-middle">Yi-Tian</span>
            </h1>
            <p class="text-sm font-bold text-vibrantBlue mb-6 flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>黎明技術學院 數位多媒體系</span>
            </p>

            <!-- Bio Quote -->
            <div class="bg-white/80 border border-indigo-50 p-4 sm:p-5 rounded-2xl shadow-inner max-w-md mx-auto">
                <p class="text-sm sm:text-base font-semibold text-darkText/80 leading-relaxed">
                    「喜歡簡單的生活，也希望每天都能學習新的知識，讓自己變得更好。」
                </p>
            </div>
        </div>

        <!-- SKILLS & INTERESTS GRID -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
            <!-- Skill: Drawing -->
            <div class="glass-card p-6 rounded-3xl shadow-lg shadow-indigo-100/50 flex items-center gap-4 hover:-translate-y-1 transition-transform">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-vibrantCoral to-amber-400 text-white flex items-center justify-center text-2xl shadow-md shadow-pink-500/20 flex-shrink-0">
                    <i class="fa-solid fa-palette"></i>
                </div>
                <div>
                    <span class="text-xs font-bold text-vibrantCoral tracking-wider uppercase block">Core Skill</span>
                    <h3 class="text-lg font-black text-darkText">專長技能：畫畫</h3>
                    <p class="text-xs text-darkText/60 font-medium">繪圖創作與視覺表現</p>
                </div>
            </div>

            <!-- Interests -->
            <div class="glass-card p-6 rounded-3xl shadow-lg shadow-indigo-100/50 flex items-center gap-4 hover:-translate-y-1 transition-transform">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-vibrantBlue to-vibrantCyan text-white flex items-center justify-center text-2xl shadow-md shadow-blue-500/20 flex-shrink-0">
                    <i class="fa-solid fa-sparkles"></i>
                </div>
                <div class="w-full">
                    <span class="text-xs font-bold text-vibrantBlue tracking-wider uppercase block">Interests</span>
                    <h3 class="text-base font-black text-darkText mb-1">日常興趣</h3>
                    <div class="flex flex-wrap gap-1.5">
                        <span class="text-xs font-bold px-2.5 py-0.5 bg-indigo-50 text-vibrantBlue rounded-md">學習中文</span>
                        <span class="text-xs font-bold px-2.5 py-0.5 bg-indigo-50 text-vibrantBlue rounded-md">聽音樂</span>
                        <span class="text-xs font-bold px-2.5 py-0.5 bg-indigo-50 text-vibrantBlue rounded-md">睡覺</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- CONTACT LINKS -->
        <div class="glass-card rounded-3xl p-6 sm:p-8 shadow-xl shadow-indigo-100/50">
            <h2 class="text-xs font-extrabold tracking-widest text-darkText/50 uppercase mb-4 text-center">聯絡方式 Contact</h2>
            
            <div class="space-y-3">
                <!-- Email -->
                <div class="flex items-center justify-between p-3.5 rounded-2xl bg-white border border-gray-100 hover:border-vibrantBlue/40 transition-colors">
                    <div class="flex items-center gap-3 min-w-0">
                        <div class="w-10 h-10 rounded-xl bg-red-100 text-red-500 flex items-center justify-center text-lg font-bold flex-shrink-0">
                            <i class="fa-solid fa-envelope"></i>
                        </div>
                        <div class="min-w-0">
                            <p class="text-xs text-darkText/50 font-bold">Email</p>
                            <p class="text-xs sm:text-sm font-bold text-darkText truncate">bd1151009@venus.lit.edu.tw</p>
                        </div>
                    </div>
                    <button onclick="copyToClipboard('bd1151009@venus.lit.edu.tw', 'Email 已複製！')" class="px-3.5 py-1.5 rounded-xl bg-vibrantBlue text-white text-xs font-bold hover:bg-blue-600 transition-colors flex-shrink-0">
                        複製
                    </button>
                </div>

                <!-- Line ID -->
                <div class="flex items-center justify-between p-3.5 rounded-2xl bg-white border border-gray-100 hover:border-emerald-400/40 transition-colors">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-xl font-bold flex-shrink-0">
                            <i class="fa-brands fa-line"></i>
                        </div>
                        <div>
                            <p class="text-xs text-darkText/50 font-bold">Line ID</p>
                            <p class="text-xs sm:text-sm font-bold text-darkText">areeyaa_2</p>
                        </div>
                    </div>
                    <button onclick="copyToClipboard('areeyaa_2', 'Line ID 已複製！')" class="px-3.5 py-1.5 rounded-xl bg-emerald-500 text-white text-xs font-bold hover:bg-emerald-600 transition-colors flex-shrink-0">
                        複製
                    </button>
                </div>

                <!-- Instagram -->
                <a href="https://instagram.com/jan212550" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between p-3.5 rounded-2xl bg-white border border-gray-100 hover:border-pink-400/40 transition-colors group">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-pink-100 text-pink-500 flex items-center justify-center text-xl font-bold flex-shrink-0">
                            <i class="fa-brands fa-instagram"></i>
                        </div>
                        <div>
                            <p class="text-xs text-darkText/50 font-bold">Instagram</p>
                            <p class="text-xs sm:text-sm font-bold text-darkText">@jan212550</p>
                        </div>
                    </div>
                    <span class="px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-pink-500 to-rose-500 text-white text-xs font-bold group-hover:opacity-90 transition-opacity flex items-center gap-1 flex-shrink-0">
                        <span>開啟</span>
                        <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                    </span>
                </a>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="py-6 text-center text-xs font-semibold text-darkText/40">
        <p>© <span id="year"></span> 曹亦天 ‧ Personal Card</p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // Set dynamic year
        document.getElementById('year').textContent = new Date().getFullYear();

        // Clipboard Copy Helper
        function copyToClipboard(text, successMessage) {
            const tempInput = document.createElement('textarea');
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            showToast(successMessage);
        }

        // Custom Notification Toast
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            
            toastMsg.textContent = message;
            toast.classList.remove('translate-y-24', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
